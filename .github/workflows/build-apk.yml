name: Build Ersalyar APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Install Gradle 8.7
        run: |
          curl -L https://services.gradle.org/distributions/gradle-8.7-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d "$HOME/gradle"
          echo "$HOME/gradle/gradle-8.7/bin" >> "$GITHUB_PATH"

      - name: Build Debug APK - Kotlin diagnostic
        id: gradle_build
        continue-on-error: true
        run: |
          gradle --no-daemon --stacktrace --info assembleDebug 2>&1 | tee build.log
          exit ${PIPESTATUS[0]}

      - name: Extract Kotlin compiler errors
        if: always()
        run: |
          echo "## Kotlin / Gradle Error Diagnostic" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo "### Kotlin compiler errors and source locations" >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          grep -E -i -A 5 -B 3             "e: .*\.kt:|error: .*\.kt:|unresolved reference|type mismatch|expecting |cannot find a parameter|no value passed for parameter|conflicting overloads|redeclaration|modifier .* is not applicable|this type is final|too many arguments|argument type mismatch"             build.log | tail -n 250 >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo "### Build failure section" >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          grep -E -i -A 12 -B 5             "FAILURE:|What went wrong:|Execution failed for task ':app:compileDebugKotlin'|Compilation error|Compilation failed"             build.log | tail -n 120 >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo "### Last 250 lines of Gradle log" >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          tail -n 250 build.log >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ersalyar-build-log
          path: build.log

      - name: Upload APK
        if: steps.gradle_build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: ersalyar-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Fail workflow if Gradle failed
        if: steps.gradle_build.outcome == 'failure'
        run: |
          echo "Gradle build failed. See 'Kotlin / Gradle Error Diagnostic' in the workflow Summary."
          exit 1
